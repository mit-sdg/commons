name: CI

on:
  push:
    branches: ["main"]
  # Include stacked PRs whose base is another feature branch.
  pull_request:

# A new push to a pull request supersedes the run still testing its last push.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Commons
        uses: ./.github/actions/setup

      - name: Run checks
        run: bun run check

  test:
    name: Backend & Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Commons
        uses: ./.github/actions/setup

      # The design, source, artifact, and issue checks run in the check job.
      - name: Run test suite
        run: bun run test

  # Each browser job builds the standalone frontend before it starts the stack,
  # so these jobs also stand as the production build check.
  browsers:
    name: Browser tests (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, project: chromium, shard: 1/3 }
          - { browser: chromium, project: chromium, shard: 2/3 }
          - { browser: chromium, project: chromium, shard: 3/3 }
          - { browser: firefox, project: firefox-mobile, shard: 1/1 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Commons
        uses: ./.github/actions/setup

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}-${{ hashFiles('frontend/src/**', 'frontend/*.ts', 'frontend/*.mjs', 'frontend/*.json') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}-

      - name: Install browser
        run: bunx --no-install playwright install --with-deps ${{ matrix.browser }}

      - name: Run browser tests
        run: bun run e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }}

      - name: Name the artifact
        if: always()
        id: artifact
        run: echo "name=browser-tests-${{ matrix.project }}-${MATRIX_SHARD/\//-of-}" >> "$GITHUB_OUTPUT"
        env:
          MATRIX_SHARD: ${{ matrix.shard }}

      - name: Upload screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
