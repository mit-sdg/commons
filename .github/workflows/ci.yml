name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd frontend

      - name: Run checks
        run: bun run check

  test:
    name: Backend & Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd frontend

      - name: Run test suite
        run: bun run test

  build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd frontend

      - name: Run build
        run: bun run build

  mobile-browsers:
    name: Mobile browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            project: chromium
          - browser: firefox
            project: firefox-mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd frontend

      - name: Install browser
        run: bunx --no-install playwright install --with-deps ${{ matrix.browser }}

      - name: Run mobile browser tests
        run: bun run e2e tests/e2e/mobile-navigation.spec.ts tests/e2e/mobile-overlays.spec.ts --project=${{ matrix.project }}

      - name: Upload screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-browser-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
